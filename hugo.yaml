# Hugo configuration file
baseURL: "https://libbabel.so"
title: "Library of Babel"

enableRobotsTxt: true
enableGitInfo: true
enableEmoji: true
hasCJKLanguage: false
enableInlineShortcodes: true

# import hextra as module
theme: hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    # - name: Docs
    #   pageRef: /docs
    #   weight: 1
    - name: Members
      pageRef: /members
      weight: 1
    - name: CTFs
      pageRef: /ctfs
      weight: 2
    - name: Writeups
      pageRef: /writeups
      weight: 3
    - name: Search
      weight: 4
      params:
        type: search
    # - name: GitHub
    #   weight: 5
    #   url: "https://github.com/imfing/hextra-starter-template"
    #   params:
    #     icon: github
    # - name: Twitter
    #   weight: 6
    #   url: "https://twitter.com/"
    #   params:
    #     icon: x-twitter

params:
  description: Website of libbabel.so, the CTF Team of IIT Kharagpur

  navbar:
    displayTitle: false
    displayLogo: false

  page:
    width: normal

  theme: 
    default: dark
    displayToggle: true

  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
    width: normal

  displayUpdatedDate: true
  dateFormat: "January 1, 2025"

  editURL:
    enable: false
    # base: "https://github.com/imfing/hextra-starter-template/edit/main/content"
  
  blog:
    list:
      displayTags: true
      # date | lastmod | publicDate| title | weight
      sortBy: date
      sortOrder: desc
    article: 
      displayPagination: true

  toc: 
    displayTags: true

  highlight:
    copy:
      enable: true
      # hover | always
      display: hover

  comments: 
    enable: false
    # type: giscus

taxonomies:
  author: "authors"
  tag: "tags"
  category: "categories"
